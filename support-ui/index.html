<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotOfTheSpecter Support</title>
    <meta name="description" content="Documentation, guides, and support tickets for BotOfTheSpecter." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sp-theme');
          if (t !== 'light' && t !== 'dark') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.className = (t === 'light' ? 'light-theme' : 'dark-theme');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="https://cdn.botofthespecter.com/logo.png" />
    <link rel="stylesheet" href="https://cdn.botofthespecter.com/css/fontawesome-7.3.1/css/all.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
