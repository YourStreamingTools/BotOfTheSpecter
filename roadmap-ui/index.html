<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotOfTheSpecter Roadmap</title>
    <meta name="description" content="BotOfTheSpecter development roadmap." />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sp-theme');
          if (!t) t = (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (t !== 'light') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.className = t === 'light' ? 'light-theme' : 'dark-theme';
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="https://cdn.botofthespecter.com/logo.png" />
    <link rel="stylesheet" href="https://cdn.botofthespecter.com/css/fontawesome-7.3.1/css/all.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
