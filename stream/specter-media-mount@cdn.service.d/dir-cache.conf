# CDN listings stay cached for an hour. The template's 30s cache re-lists Mega S4
# after a short idle, and that lookup costs about 1–2s. This drop-in applies only to
# specter-media-mount@cdn. User-upload stores stay at 30s until an upload can
# invalidate the directory cache, because a longer cache would serve a replaced file.
[Service]
ExecStart=
ExecStart=/usr/bin/rclone mount megas4:botofthespecter/%i /mnt/specter-media/%i \
    --config /root/.config/rclone/rclone.conf \
    --read-only \
    --cache-dir /var/cache/specter-media-vfs \
    --vfs-cache-mode full \
    --vfs-cache-max-size 50G \
    --vfs-cache-max-age 8760h \
    --use-server-modtime \
    --dir-cache-time 1h
